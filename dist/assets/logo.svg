<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Canvas Frame (Hand-Drawn 16:9 Sketch aesthetic) -->
  <rect x="80" y="100" width="352" height="230" rx="24" fill="#090d16" stroke="#38bdf8" stroke-width="10" stroke-dasharray="2 0" />

  <!-- Clapper Header Bars -->
  <path d="M 80 100 L 432 100 L 432 150 L 80 150 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="6" />
  <path d="M 130 100 L 160 150 M 210 100 L 240 150 M 290 100 L 320 150 M 370 100 L 400 150" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />

  <!-- Center Play / Explainer Action Symbol -->
  <polygon points="230,185 315,235 230,285" fill="url(#primaryGrad)" filter="url(#glow)" />

  <!-- Audio Waveform / Timeline Scrub Track -->
  <rect x="90" y="370" width="332" height="18" rx="9" fill="#1e293b" />
  <rect x="90" y="370" width="180" height="18" rx="9" fill="#38bdf8" />
  <circle cx="270" cy="379" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="3" filter="url(#glow)" />

  <!-- Sound Cue Waves -->
  <path d="M 120 425 Q 135 410 150 425 T 180 425 T 210 425 T 240 425 T 270 425 T 300 425 T 330 425 T 360 425 T 390 425" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" />
</svg>

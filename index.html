    <script>
      // Stub out Vite HMR WebSocket in cloud preview iframe where HMR is disabled
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          const CustomWebSocket = function(url, protocols) {
            const isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('@vite')));

            if (isViteHmr) {
              const mock = new EventTarget();
              mock.send = function() {};
              mock.close = function() {};
              mock.readyState = 1; // OPEN
              mock.url = url;
              mock.protocol = 'vite-hmr';
              mock.extensions = '';
              mock.binaryType = 'blob';
              setTimeout(() => {
                mock.dispatchEvent(new Event('open'));
              }, 10);
              return mock;
            }
            return new OrigWebSocket(url, protocols);
          };
          CustomWebSocket.prototype = OrigWebSocket.prototype;
          CustomWebSocket.CONNECTING = 0;
          CustomWebSocket.OPEN = 1;
          CustomWebSocket.CLOSING = 2;
          CustomWebSocket.CLOSED = 3;
          window.WebSocket = CustomWebSocket;
        }

        const origError = console.error;
        console.error = function(...args) {
          const text = args.map(a => (a && a.message) || String(a)).join(' ');
          if (text.includes('WebSocket') || text.includes('[vite]')) {
            return;
          }
          origError.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (e.message && (e.message.includes('WebSocket') || e.message.includes('[vite]'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
